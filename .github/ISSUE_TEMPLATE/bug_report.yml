name: Bug report
description: Report a problem with the extension
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Briefly describe the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, extension version, and operating system.
      placeholder: Chrome 140, extension 1.1.0, macOS 15
    validations:
      required: true
